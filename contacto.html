<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuertoGames | Contacto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navegación -->
    <nav class="navbar">
        <h1>PuertoGames</h1>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="producto.html">Producto</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>

    <!-- Formulario de Contacto -->
    <section class="formulario-contacto">
        <h2 class="titlecontac">Contáctanos</h2>
        <form action="#" class="contact-form">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required class="form-control">
            </div>
            <div class="form-group">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" required class="form-control">
            </div>
            <div class="form-group">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="4" required class="form-control"></textarea>
            </div>
            <button  type="submit" class="btn">Enviar Mensaje</button>
        </form>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 PuertoGames. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
